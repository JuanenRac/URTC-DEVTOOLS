[project]
name = "urtc-devtools"
version = "0.0.3"
description = "The shared repository tools of the URTC family as a versioned set."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "JuanenRac (Electro Hobby 3D)", email = "electrohobby3d@gmail.com" },
]
keywords = ["urtc", "tooling", "ci", "readme"]

[project.urls]
Homepage = "https://github.com/JuanenRac/URTC-DEVTOOLS"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "tests"]

[tool.mypy]
# the shared picture tools are copied from the family's canonical copy and are not edited (or checked) here
exclude = ['^tools/(_readme_svg|make_architecture|make_structure)\.py$']
files = ["tools", "tests"]
ignore_missing_imports = true

[tool.coverage.run]
# What is measured here is the code of this repository. The files of the set (tools/ and files/tools/ carry the same copies that every repository
# of the family receives) run, and are tested, in the repositories that carry them; the validator and the launcher of the local build are the
# repository's own copy of the shared files too.
source = ["tools"]
omit = [
    "tools/_doc_policy.py", "tools/_readme_parity.py", "tools/_readme_svg.py", "tools/_tracked_names.py", "tools/build_test.py",
    "tools/ci_validate.py", "tools/local_build.py", "tools/make_architecture.py", "tools/make_structure.py", "tools/pretty_run.py",
    "tools/run_host_tests.py", "tools/status_lights.py", "tools/universal_readme_check.py",
]

[tool.coverage.report]
show_missing = true
