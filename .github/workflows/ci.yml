name: URTC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate manifest, version, documentation and secret policy
        run: python tools/ci_validate.py
      - name: Static checks (unused names, exception chaining, syntax)
        run: |
          python -m pip install "ruff==0.17.2"
          ruff check .
      - name: Compile Python sources without running versioning build scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          excluded = {".git", ".venv", "node_modules", "dist", "build", "target", "__pycache__"}
          files = [path for path in Path(".").rglob("*.py") if not any(part in excluded for part in path.parts)]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"PYTHON_SYNTAX=PASS files={len(files)}")
          PY
      - name: Check that the copies this repository carries are the canonical files
        run: python tools/devtools_set.py check
      - name: Type check (the copies of the shared picture tools are not edited here and are left out)
        run: |
          python -m pip install "mypy==2.4.0"
          python -m mypy
      - name: Run the tests
        run: python -m unittest discover -s tests -v

  windows:
    name: Tests on Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run the tests (line endings behave differently on Windows)
        run: |
          python tools/devtools_set.py check
          python -m unittest discover -s tests -v
