name: URTC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Baseline (Python, project validation and compilation of the sources)
        uses: ./.github/actions/urtc-baseline
      - name: Static checks (unused names, exception chaining, syntax)
        run: |
          python -m pip install "ruff==0.17.1"
          ruff check .
      - name: Check that the copies this repository carries are the canonical files
        run: python tools/devtools_set.py check
      - name: Check the registry of the tooling the families share
        run: python tools/tooling_registry.py check
      - name: Type check (the copies of the shared picture tools are not edited here and are left out)
        run: |
          python -m pip install "mypy==2.4.0"
          python -m mypy
      - name: Run the tests
        run: python -m unittest discover -s tests -v

  windows:
    name: Tests on Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run the tests (line endings behave differently on Windows)
        run: |
          python tools/devtools_set.py check
          python -m unittest discover -s tests -v
